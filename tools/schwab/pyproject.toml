[project]
name = "schwab-cli"
version = "0.1.0"
description = "Schwab Trader API dev CLI for investor-basecamp"
readme = "README.md"
authors = [
    { name = "Ashtar Paniagua", email = "ashtarcodes@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "bitwarden-sdk>=1.0.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
schwab = "schwab_cli.cli:main"

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
